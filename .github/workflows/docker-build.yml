name: Build and Push Docker Base

on:
  push:
    branches:
      - main # keeps the registry cache warm
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  build:
    uses: emboldagency/.github/.github/workflows/docker-build.yml@master
    permissions:
      contents: read
      packages: write
    with:
      ubuntu_versions: '["24.04", "26.04"]'
      context: .
    secrets: inherit
